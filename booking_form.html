<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Facility &amp; Equipment Reservation</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <section class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3">Campus Facility &amp; Equipment Reservation</h1>
                        <p class="text-body-secondary">
                            Faculty receive a 15% discount.
                        </p>

                        <form method="POST" action="ReservationServlet"
                              accept-charset="UTF-8">
                            <div class="mb-3">
                                <label for="userName" class="form-label">Full name</label>
                                <input id="userName" name="userName" type="text"
                                       class="form-control" autocomplete="name"
                                       maxlength="100" required>
                            </div>

                            <div class="mb-3">
                                <label for="userRole" class="form-label">Role</label>
                                <select id="userRole" name="userRole"
                                        class="form-select" required>
                                    <option value="" selected disabled>Select a role</option>
                                    <option value="STUDENT">Student</option>
                                    <option value="FACULTY">Faculty</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="itemCategory" class="form-label">Item category</label>
                                <select id="itemCategory" name="itemCategory"
                                        class="form-select" required>
                                    <option value="" selected disabled>Select an item</option>
                                    <option value="LAPTOP">Laptop (50 AED per day)</option>
                                    <option value="PROJECTOR">Projector (80 AED per day)</option>
                                    <option value="POD">Study pod (100 AED per day)</option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-12 col-sm-6 mb-3">
                                    <label for="quantity" class="form-label">Quantity</label>
                                    <input id="quantity" name="quantity" type="number"
                                           class="form-control" min="1" step="1" required>
                                </div>
                                <div class="col-12 col-sm-6 mb-3">
                                    <label for="bookingDays" class="form-label">Booking days</label>
                                    <input id="bookingDays" name="bookingDays" type="number"
                                           class="form-control" min="1" step="1" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Submit reservation
                            </button>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
